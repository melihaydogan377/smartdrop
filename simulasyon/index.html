<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDrop - Uygulama Simülasyonu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandNavy: '#001A3D',
                        brandNavyDark: '#000F26',
                        brandGold: '#D4AF37',
                        brandGoldLight: '#F3E5AB',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000F26;
            color: #FFFFFF;
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF099 0%, #D4AF37 50%, #9B782B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .phone-shell {
            box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.9), 0 0 35px rgba(212, 175, 55, 0.15);
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .phone-scroll::-webkit-scrollbar { width: 4px; }
        .phone-scroll::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.4); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <!-- Üst Bar -->
    <header class="border-b border-white/10 bg-brandNavyDark/90 backdrop-blur-md sticky top-0 z-40">
        <div class="container mx-auto px-6 py-3.5 flex justify-between items-center">
            <a href="../" class="flex items-center gap-2.5">
                <img src="../logo.png" alt="SmartDrop" class="h-7 w-auto object-contain" onerror="this.style.display='none'">
                <span class="text-xl font-extrabold">
                    <span class="text-white">Smart</span><span class="gold-gradient-text">Drop</span>
                </span>
            </a>
            <div class="flex items-center gap-3">
                <a href="../" class="text-xs text-gray-400 hover:text-white transition-colors">Ana Sayfa</a>
                <button onclick="resetApp()" class="text-xs bg-white/5 hover:bg-brandGold hover:text-brandNavyDark text-gray-200 border border-white/15 px-3.5 py-2 rounded-xl font-semibold transition-all">
                    <i class="fas fa-redo-alt mr-1"></i> Sıfırla
                </button>
            </div>
        </div>
    </header>

    <!-- Ana Prototip Alanı -->
    <main class="container mx-auto px-4 py-6 flex-1 flex flex-col lg:flex-row items-center justify-center gap-10">

        <!-- SOL: Kısa Akış Göstergesi & Canlı API Durumu -->
        <div class="w-full max-w-sm space-y-4 order-2 lg:order-1">
            <div class="bg-brandNavy/50 border border-brandGold/20 rounded-3xl p-5">
                <h2 class="text-sm font-bold text-brandGold uppercase tracking-wider mb-3">Senaryo Adımları</h2>
                <div class="space-y-2 text-xs">
                    <div id="step-1" class="flex items-center gap-2.5 p-2.5 rounded-xl bg-brandGold/20 border border-brandGold text-white font-bold">
                        <span class="w-5 h-5 rounded-full bg-brandGold text-brandNavyDark flex items-center justify-center text-[11px] font-extrabold">1</span>
                        <span>Telefon Bağla & Kargoları Çek</span>
                    </div>
                    <div id="step-2" class="flex items-center gap-2.5 p-2.5 rounded-xl bg-white/5 text-gray-400">
                        <span class="w-5 h-5 rounded-full bg-white/10 flex items-center justify-center text-[11px] font-bold">2</span>
                        <span>Tek Panelde Kargolarım</span>
                    </div>
                    <div id="step-3" class="flex items-center gap-2.5 p-2.5 rounded-xl bg-white/5 text-gray-400">
                        <span class="w-5 h-5 rounded-full bg-white/10 flex items-center justify-center text-[11px] font-bold">3</span>
                        <span>Saat Aralığı veya Alternatif Seç</span>
                    </div>
                    <div id="step-4" class="flex items-center gap-2.5 p-2.5 rounded-xl bg-white/5 text-gray-400">
                        <span class="w-5 h-5 rounded-full bg-white/10 flex items-center justify-center text-[11px] font-bold">4</span>
                        <span>08:00 SAP / Oracle Rota Onayı</span>
                    </div>
                </div>
            </div>

            <!-- Canlı Sistem Logu -->
            <div class="bg-[#030D1F] border border-white/10 rounded-2xl p-4">
                <div class="flex items-center justify-between text-[11px] text-brandGold font-bold mb-2">
                    <span><i class="fas fa-circle text-emerald-400 text-[8px] mr-1.5"></i>Canlı Sistem</span>
                    <span class="text-gray-500 font-mono">SAP/Oracle API</span>
                </div>
                <div id="live-log" class="text-xs text-gray-300 font-mono">
                    Telefon numarası bağlantısı bekleniyor...
                </div>
            </div>
        </div>

        <!-- SAĞ: TELEFON UYGULAMA EKRANI -->
        <div class="order-1 lg:order-2">
            <div class="phone-shell w-[360px] h-[690px] bg-[#041229] rounded-[2.8rem] border-[7px] border-[#15294B] flex flex-col justify-between overflow-hidden">
                
                <!-- Üst Bar -->
                <div class="bg-[#071936] pt-2 pb-2.5 px-6 border-b border-white/10 shrink-0">
                    <div class="w-24 h-3.5 bg-[#15294B] rounded-b-xl mx-auto -mt-2 mb-2"></div>
                    <div class="flex justify-between items-center text-[11px]">
                        <span class="font-bold text-white">09:41</span>
                        <span class="font-extrabold text-xs"><span class="text-white">Smart</span><span class="text-brandGold">Drop</span></span>
                        <div class="flex items-center gap-1.5 text-gray-300">
                            <i class="fas fa-wifi"></i>
                            <i class="fas fa-battery-full text-emerald-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Dinamik Ekran -->
                <div id="screen" class="flex-1 p-5 overflow-y-auto phone-scroll flex flex-col justify-between"></div>

                <!-- Alt Menü -->
                <div class="bg-[#071936] border-t border-white/10 px-6 py-2.5 flex justify-around text-[10px] text-gray-400 shrink-0">
                    <button onclick="if(connected) showDashboard()" class="flex flex-col items-center gap-1 hover:text-brandGold">
                        <i class="fas fa-box text-sm text-brandGold"></i>
                        <span class="text-white font-semibold">Kargolarım</span>
                    </button>
                    <button onclick="if(connected) showOptions()" class="flex flex-col items-center gap-1 hover:text-brandGold">
                        <i class="fas fa-clock text-sm"></i>
                        <span>Teslimat Ayarı</span>
                    </button>
                    <button onclick="showConnect()" class="flex flex-col items-center gap-1 hover:text-brandGold">
                        <i class="fas fa-phone-alt text-sm"></i>
                        <span>Numaram</span>
                    </button>
                </div>

            </div>
        </div>

    </main>

    <script>
        let connected = false;
        let phone = "+90 532 480 26 16";
        let channel = "App Push";
        let selectedSlot = "14:00 - 16:00";
        let selectedDay = "Perşembe";
        let rescheduleSlot = "14:00 - 16:00";

        const timeSlots = ["10:00 - 12:00", "12:00 - 14:00", "14:00 - 16:00", "16:00 - 18:00"];
        const next3Days = ["Perşembe", "Cuma", "Cumartesi"];

        function setStep(num) {
            for (let i = 1; i <= 4; i++) {
                const el = document.getElementById(`step-${i}`);
                const dot = el.querySelector("span");
                if (i < num) {
                    el.className = "flex items-center gap-2.5 p-2.5 rounded-xl bg-emerald-500/15 text-emerald-300 font-semibold";
                    dot.className = "w-5 h-5 rounded-full bg-emerald-500 text-brandNavyDark flex items-center justify-center text-[10px] font-bold";
                    dot.innerHTML = '<i class="fas fa-check"></i>';
                } else if (i === num) {
                    el.className = "flex items-center gap-2.5 p-2.5 rounded-xl bg-brandGold/20 border border-brandGold text-white font-bold";
                    dot.className = "w-5 h-5 rounded-full bg-brandGold text-brandNavyDark flex items-center justify-center text-[11px] font-extrabold";
                    dot.textContent = i;
                } else {
                    el.className = "flex items-center gap-2.5 p-2.5 rounded-xl bg-white/5 text-gray-400";
                    dot.className = "w-5 h-5 rounded-full bg-white/10 flex items-center justify-center text-[11px] font-bold";
                    dot.textContent = i;
                }
            }
        }

        function setLog(msg) {
            document.getElementById("live-log").textContent = msg;
        }

        // 1. EKRAN: NUMARA BAĞLAMA
        function showConnect() {
            setStep(1);
            document.getElementById("screen").innerHTML = `
                <div class="fade-in flex flex-col justify-between h-full">
                    <div class="text-center mt-6">
                        <div class="w-16 h-16 rounded-2xl bg-brandGold/15 border border-brandGold/40 text-brandGold flex items-center justify-center text-2xl mx-auto mb-4">
                            <i class="fas fa-mobile-alt"></i>
                        </div>
                        <h3 class="text-xl font-extrabold text-white">Tek Numara Bağla</h3>
                        <p class="text-xs text-gray-400 mt-1.5">Tüm kargolarınız otomatik tek ekrana düşsün.</p>
                    </div>

                    <div class="bg-brandNavy/80 border border-brandGold/30 rounded-2xl p-4 space-y-2">
                        <label class="text-[11px] text-gray-400 font-semibold">Telefon Numaranız</label>
                        <div class="flex items-center bg-brandNavyDark border border-brandGold/40 rounded-xl px-3.5 py-3">
                            <i class="fas fa-phone text-brandGold mr-2.5 text-sm"></i>
                            <input id="phone-val" type="text" value="${phone}" class="bg-transparent text-white font-bold text-sm w-full focus:outline-none">
                        </div>
                    </div>

                    <button onclick="scanCargos()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-brandGold to-brandGoldLight text-brandNavyDark font-extrabold text-sm shadow-lg active:scale-95 transition-all">
                        Kargolarımı Tara <i class="fas fa-arrow-right ml-1.5"></i>
                    </button>
                </div>
            `;
        }

        function scanCargos() {
            const val = document.getElementById("phone-val");
            if (val) phone = val.value;
            connected = true;
            setLog("Kargo bildirimleri taranıyor...");

            document.getElementById("screen").innerHTML = `
                <div class="fade-in flex flex-col items-center justify-center h-full text-center space-y-4">
                    <div class="w-14 h-14 rounded-full border-4 border-brandGold/30 border-t-brandGold animate-spin"></div>
                    <p class="text-sm font-bold text-white">Kargolar Çekiliyor...</p>
                </div>
            `;

            setTimeout(() => {
                setLog("3 kargo firması tek panelde birleştirildi.");
                showDashboard();
            }, 900);
        }

        // 2. EKRAN: TEK PANEL KARGOLARIM
        function showDashboard() {
            setStep(2);
            document.getElementById("screen").innerHTML = `
                <div class="fade-in space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg font-extrabold text-white">Kargolarım (3)</h3>
                        <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full font-bold">Oto-Takip</span>
                    </div>

                    <!-- Yarın Teslim Edilecek Kargo Kartı -->
                    <div class="bg-gradient-to-br from-brandGold/20 to-brandNavy border border-brandGold rounded-2xl p-4 space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] text-brandGold font-extrabold uppercase">Yarın Dağıtımda</span>
                                <h4 class="text-sm font-bold text-white">Yurtiçi Kargo • #SD-84920</h4>
                                <p class="text-[11px] text-gray-300">Trendyol Teknoloji</p>
                            </div>
                            <span class="w-8 h-8 rounded-xl bg-brandGold text-brandNavyDark flex items-center justify-center text-sm">
                                <i class="fas fa-bell"></i>
                            </span>
                        </div>
                        <button onclick="showOptions()" class="w-full py-2.5 rounded-xl bg-brandGold text-brandNavyDark font-extrabold text-xs hover:opacity-95 transition-all">
                            Saat Aralığı Seç / Yönet <i class="fas fa-chevron-right ml-1"></i>
                        </button>
                    </div>

                    <!-- Diğer Kargolar -->
                    <div class="space-y-2">
                        <div class="bg-white/5 border border-white/10 rounded-2xl p-3.5 flex justify-between items-center">
                            <div>
                                <div class="text-xs font-bold text-white">Aras Kargo • #SD-51204</div>
                                <div class="text-[11px] text-gray-400">Amazon • Transfer Merkezinde</div>
                            </div>
                            <span class="text-[10px] bg-sky-500/20 text-sky-300 px-2.5 py-1 rounded-full font-bold">Yolda</span>
                        </div>
                        <div class="bg-white/5 border border-white/10 rounded-2xl p-3.5 flex justify-between items-center">
                            <div>
                                <div class="text-xs font-bold text-white">MNG Kargo • #SD-30918</div>
                                <div class="text-[11px] text-gray-400">Hepsiburada • Tamamlandı</div>
                            </div>
                            <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full font-bold">Teslim</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 3. EKRAN: SAAT ARALIĞI SEÇİMİ & ALTERNATİFLER
        function showOptions() {
            setStep(3);
            setLog("Alıcı teslimat tercihi bekleniyor...");

            document.getElementById("screen").innerHTML = `
                <div class="fade-in space-y-3.5">
                    <div class="flex justify-between items-center">
                        <button onclick="showDashboard()" class="text-xs text-gray-400 hover:text-white"><i class="fas fa-arrow-left mr-1"></i>Geri</button>
                        <div class="flex gap-1 bg-white/5 p-1 rounded-lg text-[10px]">
                            <button onclick="channel='App Push'; showOptions()" class="px-2 py-0.5 rounded ${channel==='App Push'?'bg-brandGold text-brandNavyDark font-bold':'text-gray-400'}">Push</button>
                            <button onclick="channel='SMS'; showOptions()" class="px-2 py-0.5 rounded ${channel==='SMS'?'bg-brandGold text-brandNavyDark font-bold':'text-gray-400'}">SMS</button>
                            <button onclick="channel='Sesli Arama'; showOptions()" class="px-2 py-0.5 rounded ${channel==='Sesli Arama'?'bg-brandGold text-brandNavyDark font-bold':'text-gray-400'}">Arama</button>
                        </div>
                    </div>

                    <!-- SEÇENEK 1: YARIN SAAT ARALIĞI SEÇ -->
                    <div class="bg-brandNavy/90 border border-brandGold/40 rounded-2xl p-3.5 space-y-2.5">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-white"><i class="fas fa-clock text-brandGold mr-1.5"></i>Yarın Teslimat Saati Seç</span>
                            <span class="text-[10px] text-brandGold font-semibold">${channel}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            ${timeSlots.map(slot => `
                                <button onclick="selectedSlot='${slot}'; showOptions()" class="py-2 px-2 rounded-xl text-[11px] font-bold border transition-all ${selectedSlot === slot ? 'bg-brandGold text-brandNavyDark border-brandGold' : 'bg-brandNavyDark/80 text-gray-300 border-white/10 hover:border-brandGold/50'}">
                                    ${slot}
                                </button>
                            `).join("")}
                        </div>
                        <button onclick="confirmAction('tomorrow')" class="w-full py-2.5 rounded-xl bg-emerald-500 text-brandNavyDark font-extrabold text-xs hover:opacity-95 transition-all">
                            Yarın ${selectedSlot} Onayla
                        </button>
                    </div>

                    <!-- ALTERNATİF SEÇENEKLER -->
                    <div class="space-y-2">
                        <span class="text-[10px] uppercase tracking-wider text-gray-400 font-bold block">Evde Değilseniz Alternatifler</span>

                        <button onclick="confirmAction('neighbor')" class="w-full p-3 rounded-xl bg-white/5 hover:border-brandGold/50 border border-white/10 flex justify-between items-center text-left transition-all">
                            <span class="text-xs font-bold text-white"><i class="fas fa-user-friends text-amber-400 mr-2"></i>Komşuya Bırak (Daire 4)</span>
                            <i class="fas fa-chevron-right text-gray-500 text-xs"></i>
                        </button>

                        <button onclick="confirmAction('locker')" class="w-full p-3 rounded-xl bg-white/5 hover:border-brandGold/50 border border-white/10 flex justify-between items-center text-left transition-all">
                            <span class="text-xs font-bold text-white"><i class="fas fa-box text-purple-400 mr-2"></i>Kargo Otomatına Yönlendir</span>
                            <i class="fas fa-chevron-right text-gray-500 text-xs"></i>
                        </button>

                        <button onclick="showReschedule()" class="w-full p-3 rounded-xl bg-white/5 hover:border-brandGold/50 border border-white/10 flex justify-between items-center text-left transition-all">
                            <span class="text-xs font-bold text-white"><i class="fas fa-calendar-alt text-sky-400 mr-2"></i>Tarihi Ertele (3 Gün İçinde Seç)</span>
                            <i class="fas fa-chevron-right text-brandGold text-xs"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // 3B. EKRAN: 3 GÜN İÇİNDE GÜN VE SAAT SEÇİMİ
        function showReschedule() {
            document.getElementById("screen").innerHTML = `
                <div class="fade-in flex flex-col justify-between h-full space-y-4">
                    <div class="space-y-4">
                        <button onclick="showOptions()" class="text-xs text-gray-400 hover:text-white"><i class="fas fa-arrow-left mr-1"></i>Geri</button>
                        
                        <div>
                            <h3 class="text-base font-extrabold text-white">Teslimat Günü ve Saati Seçin</h3>
                            <p class="text-[11px] text-gray-400">Önümüzdeki 3 gün içinden uygun zamanı belirleyin.</p>
                        </div>

                        <!-- 3 Gün Seçimi -->
                        <div class="space-y-1.5">
                            <span class="text-[11px] text-brandGold font-bold">1. Gün Seçin</span>
                            <div class="grid grid-cols-3 gap-2">
                                ${next3Days.map((day, idx) => `
                                    <button onclick="selectedDay='${day}'; showReschedule()" class="p-2.5 rounded-xl border text-center transition-all ${selectedDay === day ? 'bg-brandGold text-brandNavyDark border-brandGold font-extrabold' : 'bg-white/5 text-gray-300 border-white/10'}">
                                        <div class="text-xs">${day}</div>
                                        <div class="text-[10px] opacity-75">+${idx + 2} Gün</div>
                                    </button>
                                `).join("")}
                            </div>
                        </div>

                        <!-- Saat Aralığı Seçimi -->
                        <div class="space-y-1.5">
                            <span class="text-[11px] text-brandGold font-bold">2. Saat Aralığı Seçin</span>
                            <div class="grid grid-cols-2 gap-2">
                                ${timeSlots.map(slot => `
                                    <button onclick="rescheduleSlot='${slot}'; showReschedule()" class="py-2.5 px-2 rounded-xl text-[11px] font-bold border transition-all ${rescheduleSlot === slot ? 'bg-brandGold text-brandNavyDark border-brandGold' : 'bg-white/5 text-gray-300 border-white/10'}">
                                        ${slot}
                                    </button>
                                `).join("")}
                            </div>
                        </div>
                    </div>

                    <button onclick="confirmAction('reschedule')" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-brandGold to-brandGoldLight text-brandNavyDark font-extrabold text-xs shadow-lg">
                        ${selectedDay} • ${rescheduleSlot} Olarak Ertele
                    </button>
                </div>
            `;
        }

        // 4. EKRAN: ONAY & 08:00 API AKTARIMI
        function confirmAction(type) {
            setStep(4);
            let title = "";
            let sub = "";

            if (type === "tomorrow") {
                title = `Yarın ${selectedSlot}`;
                sub = "Seçtiğiniz 2 saatlik aralık onaylandı.";
            } else if (type === "neighbor") {
                title = "Komşuya Bırakılacak";
                sub = "Daire 4 (Ahmet Yılmaz) tanımlandı.";
            } else if (type === "locker") {
                title = "Kargo Otomatına Yönlendirildi";
                sub = "Metro Çıkışı Otomat #12 rezerve edildi.";
            } else if (type === "reschedule") {
                title = `${selectedDay} • ${rescheduleSlot}`;
                sub = "Teslimat seçtiğiniz gün ve saate ertelendi.";
            }

            setLog(`Onaylandı (${title}) -> 08:00 SAP/Oracle API aktarıldı.`);

            document.getElementById("screen").innerHTML = `
                <div class="fade-in flex flex-col justify-between h-full text-center">
                    <div class="mt-8 space-y-3">
                        <div class="w-16 h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-400 text-emerald-400 flex items-center justify-center text-3xl mx-auto">
                            <i class="fas fa-check"></i>
                        </div>
                        <h3 class="text-lg font-extrabold text-white">${title}</h3>
                        <p class="text-xs text-gray-300">${sub}</p>
                    </div>

                    <div class="bg-brandNavy/90 border border-brandGold/30 rounded-2xl p-4 text-left space-y-1.5">
                        <div class="text-[11px] font-bold text-brandGold flex justify-between">
                            <span><i class="fas fa-network-wired mr-1"></i>08:00 Rota API</span>
                            <span class="text-emerald-400">Aktarıldı</span>
                        </div>
                        <p class="text-[11px] text-gray-300">Kurye rotası sabah 08:00 itibarıyla güncellendi.</p>
                    </div>

                    <div class="space-y-2">
                        <button onclick="showDashboard()" class="w-full py-3 rounded-xl bg-brandGold text-brandNavyDark font-extrabold text-xs">
                            Kargolarıma Dön
                        </button>
                        <button onclick="showOptions()" class="w-full py-2.5 rounded-xl bg-white/5 text-gray-300 font-semibold text-xs">
                            Seçimi Değiştir
                        </button>
                    </div>
                </div>
            `;
        }

        function resetApp() {
            connected = false;
            channel = "App Push";
            selectedSlot = "14:00 - 16:00";
            selectedDay = "Perşembe";
            rescheduleSlot = "14:00 - 16:00";
            setLog("Telefon numarası bağlantısı bekleniyor...");
            showConnect();
        }

        showConnect();
    </script>
</body>
</html>
